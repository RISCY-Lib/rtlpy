[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[project]
name = "rtlpy"
version = "2.0.0a1"
description = "A Library of Python Utilities for RTL Design"
readme = "README.md"
authors = [{name = "Benjamin Davis", email = "allrisc.dev@gmail.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
keywords = ["rtl", "utilities", "SystemVerilog", "Verilog", "UVM"]

dependencies = [
    "pydantic-xml>=2.17.3",
    "pyslang>=9.0.0",
]


[project.urls]
Homepage = "https://github.com/RISC-Lib/rtlpy"
Documentation = "https://rtlpy.readthedocs.io/en/latest/index.html"

[dependency-groups]
dev = [
    "ruff>=0.12.8",
    "tox>=4.25.0",
    "tox-uv>=1.13.1",
    "xmlschema>=3.4.5",
]
docs=[
    "sphinx>=5.3.0",
    "sphinx-rtd-theme>=2.0.0",
]
tests=[
    "pytest>=7.4.4",
]
typing=[
    "mypy>=1.4.1",
    "pyslang-stubs>=9.0.0.20250902",
]

[tool.uv]
default-groups = ["dev", "docs", "tests", "typing"]

[tool.mypy]
warn_return_any = true

python_version = "3.9"

files = ["src", "tests"]

pretty = true


[tool.pyright]
pythonVersion = "3.9"
include = ["src"]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
indent-width = 4

target-version = "py39"
show-fixes = true

src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
ignore = [
    "UP038",  # keep isinstance tuple
]

[tool.tox]
env_list = [
    "py3.13", "py3.12", "py3.11", "py3.10", "py3.9",
    "style",
    "typing",
    # "docs",
]

[tool.tox.env_run_base]
description = "pytest on latest dependency versions"
runner = "uv-venv-lock-runner"
package = "wheel"
wheel_build_env = ".pkg"
constrain_package_deps = true
use_frozen_constraints = true
dependency_groups = ["tests"]

commands = [[
    "pytest", "-v", "--tb=short", "--basetemp={env_tmp_dir}",
    {replace = "posargs", default = [], extend = true},
]]

[tool.tox.env.style]
description = "run linting and style checks on code"
dependency_groups = ["dev"]
skip_install = true
commands = [["ruff", "check"]]

[tool.tox.env.typing]
description = "run static type checkers"
dependency_groups = ["typing", "tests"]
commands = [
    ["mypy"],
]

[tool.tox.env.docs]
description = "build docs"
dependency_groups = ["docs"]
commands = [["sphinx-build", "-E", "-W", "-b", "dirhtml", "docs/source", "docs/_build/dirhtml"]]
